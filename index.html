<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velocity Gmail Bot - Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; background-color: #020617; user-select: none; }
    .wp-menu-active { background-color: #0284c7 !important; color: #ffffff !important; border-left: 4px solid #38bdf8; }
    .wp-menu-item { border-left: 4px solid transparent; }
    .wp-menu-item:hover { background-color: #1e293b; color: #38bdf8; }
  </style>
</head>
<body class="text-slate-200 min-h-screen bg-slate-950">

  <div id="loginScreen" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-[99999] flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 w-full max-w-sm text-center space-y-6">
      <div class="w-16 h-16 bg-blue-500 text-white rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-lg">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <h2 class="text-2xl font-extrabold text-white">Velocity Admin</h2>
        <p class="text-xs text-sky-400 mt-1">পাসওয়ার্ড টাইপ করে প্রবেশ করুন</p>
      </div>
      <div class="space-y-4 text-left">
        <input type="password" id="loginPasswordInput" placeholder="পাসওয়ার্ড লিখুন..." class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white outline-none focus:border-sky-400 font-mono">
        <button type="button" onclick="attemptLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-2xl text-xs">লগইন করুন</button>
      </div>
    </div>
  </div>

  <div id="mainAdminApp" class="hidden min-h-screen flex-col md:flex-row w-full">
    <aside class="w-full md:w-64 bg-slate-900 border-r border-slate-800 p-3 space-y-1 text-xs font-semibold text-slate-400">
      <div class="p-4 border-b border-slate-800 flex items-center space-x-2 text-white font-bold text-base">
        <i class="fa-solid fa-envelope text-blue-500"></i>
        <span>Velocity Admin</span>
      </div>
      <button onclick="showSection('dash')" id="menuDash" class="w-full text-left p-3 rounded-xl wp-menu-item wp-menu-active">ড্যাশবোর্ড</button>
      <button onclick="showSection('gmailManager')" id="menuGmailManager" class="w-full text-left p-3 rounded-xl wp-menu-item text-sky-400">📥 জিমেইল সাবমিশন</button>
      <button onclick="showSection('regControl')" id="menuRegControl" class="w-full text-left p-3 rounded-xl wp-menu-item text-amber-400">➕ Register টাস্ক সেট</button>
      <button onclick="showSection('withdraws')" id="menuWithdraws" class="w-full text-left p-3 rounded-xl wp-menu-item">উইথড্র রিকোয়েস্ট</button>
      <button onclick="showSection('rates')" id="menuRates" class="w-full text-left p-3 rounded-xl wp-menu-item text-emerald-400">রেট ও সেটিংস</button>
    </aside>

    <main class="flex-1 p-6 space-y-6 overflow-y-auto">
      <!-- 1. DASHBOARD -->
      <div id="secDash" class="space-y-4">
        <h2 class="text-2xl font-bold text-white">ড্যাশবোর্ড সামারি</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800"><p class="text-xs text-slate-400">মোট ইউজার</p><h3 id="statUsers" class="text-2xl font-black text-white mt-1">0</h3></div>
          <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800"><p class="text-xs text-slate-400">পেন্ডিং জিমেইল</p><h3 id="statPendingSubmissions" class="text-2xl font-black text-amber-400 mt-1">0</h3></div>
          <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800"><p class="text-xs text-slate-400">পেন্ডিং উইথড্র</p><h3 id="statPendingWithdraws" class="text-2xl font-black text-emerald-400 mt-1">0</h3></div>
        </div>
      </div>

      <!-- 2. GMAIL SUBMISSION REVIEW -->
      <div id="secGmailManager" class="space-y-4 hidden">
        <h2 class="text-2xl font-bold text-sky-400">জিমেইল সাবমিশন রিভিউ</h2>
        <div id="gmailSubmissionsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>

      <!-- 3. REGISTER TASK SETTINGS -->
      <div id="secRegControl" class="space-y-4 hidden">
        <h2 class="text-2xl font-bold text-amber-400">➕ Register New Gmail কন্ট্রোল</h2>
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-bold">
          <div><label class="block text-slate-300 mb-1">স্ট্যাটাস</label><select id="regTaskStatusSelect" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-700 text-white"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
          <div><label class="block text-slate-300 mb-1">পুরস্কার ($)</label><input type="number" step="0.01" id="regTaskRewardInput" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-700 text-amber-400 font-mono"></div>
          <div><label class="block text-slate-300 mb-1">First Name</label><input type="text" id="regTaskFirstNameInput" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-700 text-white"></div>
          <div><label class="block text-slate-300 mb-1">Last Name</label><input type="text" id="regTaskLastNameInput" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-700 text-white"></div>
          <div><label class="block text-slate-300 mb-1">DOB</label><input type="text" id="regTaskDOBInput" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-700 text-white"></div>
          <div><label class="block text-slate-300 mb-1">Target Gmail</label><input type="text" id="regTaskGmailFormatInput" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-700 text-white font-mono"></div>
          <div class="md:col-span-2"><label class="block text-slate-300 mb-1">Password</label><input type="text" id="regTaskPassInput" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-700 text-white font-mono"></div>
          <div class="md:col-span-2"><label class="block text-slate-300 mb-1">Note</label><textarea id="regTaskNoteInput" rows="2" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-700 text-white"></textarea></div>
          <button onclick="saveRegisterGmailTaskSettings()" class="md:col-span-2 bg-amber-500 hover:bg-amber-600 text-black font-extrabold py-3 rounded-xl">সেভ করুন</button>
        </div>
      </div>

      <!-- 4. WITHDRAWALS -->
      <div id="secWithdraws" class="space-y-4 hidden">
        <h2 class="text-2xl font-bold text-white">উইথড্র রিকোয়েস্ট</h2>
        <div id="withdrawRequestsContainer" class="space-y-3"></div>
      </div>

      <!-- 5. RATES -->
      <div id="secRates" class="space-y-4 hidden">
        <h2 class="text-2xl font-bold text-emerald-400">রেট ও সেটিংস</h2>
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 grid grid-cols-1 md:grid-cols-3 gap-4 text-xs font-bold">
          <div><label class="block text-slate-300 mb-1">Aged ($)</label><input type="number" step="0.01" id="rateAgedInput" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-700 text-amber-400 font-mono"></div>
          <div><label class="block text-slate-300 mb-1">Old ($)</label><input type="number" step="0.01" id="rateOldInput" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-700 text-amber-400 font-mono"></div>
          <div><label class="block text-slate-300 mb-1">New ($)</label><input type="number" step="0.01" id="rateNewInput" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-700 text-amber-400 font-mono"></div>
          <div><label class="block text-slate-300 mb-1">Used ($)</label><input type="number" step="0.01" id="rateUsedInput" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-700 text-amber-400 font-mono"></div>
          <div><label class="block text-emerald-400 mb-1">$1 = BDT</label><input type="number" id="rateUsdToBdtInput" class="w-full bg-slate-950 p-3 rounded-xl border border-emerald-500 text-emerald-300 font-mono"></div>
          <button onclick="saveAdminRatesSettings()" class="md:col-span-3 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold">রেট সেভ করুন</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDjKlfhOAi8aC7gzrYYjnXY1RvYcHiAddM",
      authDomain: "sohag-52ad5.firebaseapp.com",
      databaseURL: "https://sohag-52ad5-default-rtdb.firebaseio.com",
      projectId: "sohag-52ad5",
      storageBucket: "sohag-52ad5.firebasestorage.app",
      messagingSenderId: "1077406659596",
      appId: "1:1077406659596:web:f56d093474a8c3e310ea29",
      measurementId: "G-DNQTP2B3YP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentAdminPassword = 'admin123';

    function attemptLogin() {
      const pass = document.getElementById('loginPasswordInput').value.trim();
      if (pass === currentAdminPassword || pass === 'admin123') {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainAdminApp').classList.remove('hidden');
        document.getElementById('mainAdminApp').style.display = 'flex';
        loadDashboard();
        loadGmailSubmissions();
        loadRegSettings();
        loadWithdrawals();
        loadRates();
      } else {
        alert("ভুল পাসওয়ার্ড!");
      }
    }

    function showSection(sec) {
      ['secDash', 'secGmailManager', 'secRegControl', 'secWithdraws', 'secRates'].forEach(id => document.getElementById(id).classList.add('hidden'));
      ['menuDash', 'menuGmailManager', 'menuRegControl', 'menuWithdraws', 'menuRates'].forEach(id => document.getElementById(id).classList.remove('wp-menu-active'));
      document.getElementById('sec' + sec.charAt(0).toUpperCase() + sec.slice(1)).classList.remove('hidden');
      document.getElementById('menu' + sec.charAt(0).toUpperCase() + sec.slice(1)).classList.add('wp-menu-active');
    }

    function loadDashboard() {
      db.ref('users').on('value', snap => document.getElementById('statUsers').innerText = snap.exists() ? snap.numChildren() : 0);
      db.ref('submissions').on('value', snap => {
        let p = 0;
        if (snap.exists()) snap.forEach(c => { if (c.val().status === 'pending') p++; });
        document.getElementById('statPendingSubmissions').innerText = p;
      });
      db.ref('withdrawals').on('value', snap => {
        let p = 0;
        if (snap.exists()) snap.forEach(c => { if (c.val().status === 'pending') p++; });
        document.getElementById('statPendingWithdraws').innerText = p;
      });
    }

    function loadGmailSubmissions() {
      db.ref('submissions').on('value', snap => {
        const container = document.getElementById('gmailSubmissionsContainer');
        container.innerHTML = '';
        if (!snap.exists()) { container.innerHTML = `<p class="text-xs text-slate-500">কোনো সাবমিশন নেই</p>`; return; }

        let items = [];
        snap.forEach(c => items.push({ subKey: c.key, ...c.val() }));
        items.reverse();

        items.forEach(s => {
          let badge = s.status === 'approved' ? '<span class="text-emerald-400 font-bold">Approved</span>' : s.status === 'rejected' ? '<span class="text-rose-400 font-bold">Rejected</span>' : '<span class="text-amber-400 font-bold">Pending</span>';

          container.innerHTML += `
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2 text-xs">
              <div class="flex justify-between"><span class="font-bold text-sky-400">${s.taskTitle}</span>${badge}</div>
              <p class="text-white font-mono">📧 ${s.gmailAddress}</p>
              <p class="text-amber-400 font-mono">🔑 ${s.gmailPassword}</p>
              <p class="text-slate-400">UID: ${s.uid} | রিওয়ার্ড: $${parseFloat(s.reward||0).toFixed(2)}</p>
              ${s.status === 'pending' ? `
                <div class="flex space-x-2 pt-2">
                  <button onclick="approveSub('${s.subKey}', '${s.uid}', ${s.reward||0}, '${s.referredBy||''}')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl">Approve</button>
                  <button onclick="rejectSub('${s.subKey}', '${s.uid}')" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 rounded-xl">Reject</button>
                </div>
              ` : ''}
            </div>
          `;
        });
      });
    }

    function approveSub(subKey, uid, reward, referredBy) {
      db.ref('users/' + uid).get().then(uSnap => {
        let curBal = uSnap.exists() ? (parseFloat(uSnap.val().balanceUSD) || 0) : 0;
        let updates = {};
        updates['/users/' + uid + '/balanceUSD'] = curBal + reward;
        updates['/submissions/' + subKey + '/status'] = 'approved';
        updates['/user_submissions/' + uid + '/' + subKey + '/status'] = 'approved';

        if (referredBy && referredBy !== uid) {
          const commission = (reward * 0.10);
          db.ref('users/' + referredBy).get().then(refSnap => {
            if (refSnap.exists()) {
              let refBal = parseFloat(refSnap.val().balanceUSD) || 0;
              let refInc = parseFloat(refSnap.val().refIncome) || 0;
              updates['/users/' + referredBy + '/balanceUSD'] = refBal + commission;
              updates['/users/' + referredBy + '/refIncome'] = refInc + commission;
              db.ref().update(updates);
            } else {
              db.ref().update(updates);
            }
          });
        } else {
          db.ref().update(updates);
        }
        alert("এপ্রুভ সফল হয়েছে!");
      });
    }

    function rejectSub(subKey, uid) {
      let updates = {};
      updates['/submissions/' + subKey + '/status'] = 'rejected';
      updates['/user_submissions/' + uid + '/' + subKey + '/status'] = 'rejected';
      db.ref().update(updates).then(() => alert("বাতিল করা হয়েছে!"));
    }

    function loadRegSettings() {
      db.ref('settings/registerGmailTask').once('value').then(snap => {
        if (snap.exists()) {
          const t = snap.val();
          document.getElementById('regTaskStatusSelect').value = t.status || 'inactive';
          document.getElementById('regTaskRewardInput').value = t.reward || 0.18;
          document.getElementById('regTaskFirstNameInput').value = t.firstName || '';
          document.getElementById('regTaskLastNameInput').value = t.lastName || '';
          document.getElementById('regTaskDOBInput').value = t.dob || '';
          document.getElementById('regTaskGmailFormatInput').value = t.gmailFormat || '';
          document.getElementById('regTaskPassInput').value = t.targetPass || '';
          document.getElementById('regTaskNoteInput').value = t.note || '';
        }
      });
    }

    function saveRegisterGmailTaskSettings() {
      db.ref('settings/registerGmailTask').set({
        status: document.getElementById('regTaskStatusSelect').value,
        reward: parseFloat(document.getElementById('regTaskRewardInput').value) || 0.18,
        firstName: document.getElementById('regTaskFirstNameInput').value.trim(),
        lastName: document.getElementById('regTaskLastNameInput').value.trim(),
        dob: document.getElementById('regTaskDOBInput').value.trim(),
        gmailFormat: document.getElementById('regTaskGmailFormatInput').value.trim(),
        targetPass: document.getElementById('regTaskPassInput').value.trim(),
        note: document.getElementById('regTaskNoteInput').value.trim()
      }).then(() => alert("Register New Gmail সেটিংস সেভ হয়েছে!"));
    }

    function loadWithdrawals() {
      db.ref('withdrawals').on('value', snap => {
        const container = document.getElementById('withdrawRequestsContainer');
        container.innerHTML = '';
        if (!snap.exists()) { container.innerHTML = `<p class="text-xs text-slate-500">কোনো উইথড্র নেই</p>`; return; }

        let items = [];
        snap.forEach(c => items.push({ wKey: c.key, ...c.val() }));
        items.reverse();

        items.forEach(w => {
          container.innerHTML += `
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center text-xs">
              <div>
                <p class="font-bold text-white">${w.method} - ${w.account}</p>
                <p class="text-slate-400">UID: ${w.uid} | নিট: $${parseFloat(w.amountUSD||0).toFixed(2)} (${w.amountBDT||'0'} BDT)</p>
              </div>
              ${w.status === 'pending' ? `
                <button onclick="payWithdraw('${w.wKey}', '${w.uid}')" class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold">Mark Paid</button>
              ` : `<span class="text-emerald-400 font-bold">${w.status}</span>`}
            </div>
          `;
        });
      });
    }

    function payWithdraw(wKey, uid) {
      let updates = {};
      updates['/withdrawals/' + wKey + '/status'] = 'paid';
      updates['/user_withdrawals/' + uid + '/' + wKey + '/status'] = 'paid';
      db.ref().update(updates).then(() => alert("Paid স্ট্যাটাস আপডেট হয়েছে!"));
    }

    function loadRates() {
      db.ref('settings/rates').once('value').then(snap => {
        if (snap.exists()) {
          const r = snap.val();
          document.getElementById('rateAgedInput').value = r.aged || 0.25;
          document.getElementById('rateOldInput').value = r.old || 0.21;
          document.getElementById('rateNewInput').value = r.new || 0.18;
          document.getElementById('rateUsedInput').value = r.used || 0.09;
          document.getElementById('rateUsdToBdtInput').value = r.usdToBdt || 120;
        }
      });
    }

    function saveAdminRatesSettings() {
      db.ref('settings/rates').set({
        aged: parseFloat(document.getElementById('rateAgedInput').value) || 0.25,
        old: parseFloat(document.getElementById('rateOldInput').value) || 0.21,
        new: parseFloat(document.getElementById('rateNewInput').value) || 0.18,
        used: parseFloat(document.getElementById('rateUsedInput').value) || 0.09,
        usdToBdt: parseFloat(document.getElementById('rateUsdToBdtInput').value) || 120
      }).then(() => alert("রেট সফলভাবে সেভ হয়েছে!"));
    }
  </script>
</body>
</html>
